# The projects this vault holds, and the vocabulary they share.
# A key is PROJECT-NUMBER and the project is a folder at the root.
# transitions is the workflow; leaving it out means anything can move
# to anything.
name: A new project
projects:
  - key: PROJ
    name: A new project
statuses:
  - name: Backlog
    category: todo
  - name: Ready
    category: todo
  - name: In progress
    category: doing
  - name: In review
    category: doing
  - name: Done
    category: done
  - name: Dropped
    category: done
types:
  - name: epic
    level: 1
  - task
  - bug
  - story
  - name: subtask
    level: -1
priorities:
  - low
  - normal
  - high
  - urgent
# What an estimate is counted in. unit is free text: a team that counts
# hours says hours. scale is the values offered and accepted — remove it
# to allow any number, remove the whole block to not estimate at all.
# A task with children carries no estimate; it is the sum of theirs.
estimates:
  unit: points
  scale: [1, 2, 3, 5, 8, 13]
